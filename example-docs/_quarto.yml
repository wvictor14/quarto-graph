project:
  type: website
  pre-render: quarto-graph prerender
  post-render: quarto-graph postrender

filters:
  - quarto-graph

quarto-graph:
  sidebar: true   # default. Per-page override: `quarto-graph: sidebar: false`.

website:
  title: "quarto-graph docs"
  sidebar:
    style: "docked"
    contents:
      - getting-started/index.qmd
      - section: "Concepts"
        contents:
          - concepts/wikilinks-and-aliases/index.qmd
          - concepts/the-graph-widget/index.qmd
          - concepts/backlinks/index.qmd
      - section: "Reference"
        contents:
          - reference/cli/index.qmd
          - news/index.qmd
          - reference/limitations/index.qmd
      - graph/index.qmd
  page-footer:
    center: "quarto-graph v0.4.0"

format:
  html:
    toc: true   # required: mini-graph renders into the toc/margin sidebar
    grid:
      margin-width: 380px
    theme:
      light: [flatly, styles.scss]
      dark: [darkly, styles.scss, dark.scss]
    respect-user-color-scheme: true
    highlight-style:
      light: pygments
      dark: zenburn