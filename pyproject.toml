[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quarto-graph"
version = "0.2.0"
description = "Obsidian-wikilink resolver shared by the quarto-graph Quarto extension and editor tooling"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.scripts]
quarto-graph = "quarto_graph.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
