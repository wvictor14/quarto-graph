[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "quarto-graph"
dynamic = ["version"]
description = "Obsidian-wikilink resolver shared by the quarto-graph Quarto extension and editor tooling"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6"]

[project.scripts]
quarto-graph = "quarto_graph.cli:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
